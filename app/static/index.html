<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PitchMorph · 声轨分离</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0C10'/%3E%3Cg stroke='%23F2A93B' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M8 19v-6M13 23V9M18 21V11M23 17v-2'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M6 19v-6"/><path d="M11 23V9"/><path d="M16 21V11"/><path d="M21 18v-4"/><path d="M26 16v-.5"/>
        </g>
      </svg>
      <div class="brand-text">
        <span class="brand-name">PitchMorph</span>
        <span class="brand-sub">stem separator</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="chip" id="chip-provider" title="ONNX Runtime 执行器">CPU</span>
      <span class="chip" id="chip-weights" title="权重缓存状态">权重检测中</span>
      <button class="icon-btn" id="btn-health" aria-label="环境自检" title="环境自检">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 2.7 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9.6 4.1a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 19.4 11a2 2 0 1 1 0 4Z"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage" data-view="home">

    <!-- ── 任务列表（默认视图，始终可回到这里） ───────────────── -->
    <section class="view" id="view-home">
      <div class="compose">
        <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖入音频文件">
          <input type="file" id="file-input" hidden>
          <div class="drop-inner">
            <svg class="drop-icon" viewBox="0 0 48 48" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <path d="M6 30v-12M12 35V13M18 32V16M24 38V10M30 31V17M36 34V14M42 28v-8"/>
              </g>
            </svg>
            <h1 class="drop-title">拖入音频，添加任务</h1>
            <p class="drop-sub" id="drop-formats">WAV · FLAC · MP3</p>
            <p class="drop-limit mono" id="drop-limit">≤ 12:00 · ≤ 300 MB · 支持批量拖入</p>
          </div>
          <span class="drop-scan" aria-hidden="true"></span>
        </div>

        <div class="compose-bar">
          <div class="segmented" id="tiers" role="radiogroup" aria-label="分离档位"></div>
          <button class="btn btn-primary" id="btn-pick">选择文件</button>
        </div>
        <p class="error-line" id="upload-error" role="alert" hidden></p>
      </div>

      <div class="taskboard">
        <div class="taskboard-head">
          <h2>任务</h2>
          <span class="mono dim" id="task-summary">—</span>
        </div>
        <div id="task-groups"></div>
        <p class="empty" id="task-empty" hidden>
          还没有任务。拖一首歌进上面的区域，或点「选择文件」。
        </p>
      </div>
    </section>

    <!-- ── 多轨工作台 ─────────────────────────────────────────── -->
    <section class="view" id="view-workbench">
      <div class="wb-head">
        <button class="btn btn-ghost" id="btn-back">
          <svg class="i-back" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg>
          任务列表
        </button>
        <div class="wb-title-group">
          <h2 id="wb-title">—</h2>
          <p class="wb-sub mono" id="wb-sub">—</p>
        </div>
        <div class="wb-actions">
          <a class="btn btn-primary" id="btn-zip">下载全部</a>
        </div>
      </div>

      <div class="tracks" id="tracks">
        <div class="playhead" id="playhead" aria-hidden="true"><span></span></div>
      </div>

      <div class="transport">
        <button class="play-btn" id="btn-play" aria-label="播放">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5h3.2v14H7.5zM13.3 5h3.2v14h-3.2z"/></svg>
        </button>
        <span class="mono time" id="time-now">00:00.0</span>
        <div class="seek" id="seek" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="seek-fill" id="seek-fill"></div>
          <div class="seek-knob"></div>
        </div>
        <span class="mono time dim" id="time-total">00:00.0</span>
        <button class="icon-btn loop" id="btn-loop" aria-pressed="false" aria-label="循环播放" title="循环播放">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V7a3 3 0 0 1 3-3h10l-2.2-2.2M20 15v2a3 3 0 0 1-3 3H7l2.2 2.2"/><path d="M17 4l2.8 2.8M7 20l-2.8-2.8"/></svg>
        </button>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>本地处理 · 音频不出本机</span>
    <span class="dot-sep"></span>
    <span>ONNX Runtime · 无 PyTorch 依赖</span>
  </footer>
</div>

<dialog id="health-dialog" class="sheet">
  <form method="dialog" class="sheet-inner">
    <header class="sheet-head">
      <h3>环境自检</h3>
      <button class="icon-btn" value="close" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <dl class="sheet-list" id="health-list"></dl>
    <p class="sheet-note" id="health-note"></p>
  </form>
</dialog>

<script type="module" src="/static/app.js"></script>
</body>
</html>
