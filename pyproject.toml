[project]
name = "pitchmorph"
version = "3.0.0.dev0"
description = "本地音乐分析工具：分轨、音高、音符与 OpenUtau 导出"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.3",
    # WinML 构建：单包即带 DirectML EP，无需 Windows App SDK Runtime（见 docs/07-spike.md §8）
    "onnxruntime-windowsml>=1.30",
    "huggingface-hub>=0.24",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# demucs-onnx 在 requires_dist 里硬依赖 CPU 版 onnxruntime，会覆盖 onnxruntime-windowsml，
# 所以必须 `pip install --no-deps demucs-onnx`（见 docs/weights.md §3.3），这里只做记录。
demucs = ["demucs-onnx==0.3.4"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
