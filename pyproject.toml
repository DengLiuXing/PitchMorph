[project]
name = "pitchmorph"
version = "2.0.0"
description = "本地分轨 + 音高分析 → MIDI / OpenUtau 工程"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
    "soundfile>=0.13",
    "imageio-ffmpeg>=0.5",
    "soxr>=0.5",
    "numpy>=1.26",
    # 钉死版本：升级 Python 时不能让 torch 一起变，否则出问题分不清是哪个变量。
    # 2.11.0+cu128 已在 sm_120（RTX 5060）上由 scripts/probe_env.py 验证通过。
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "demucs==4.0.1",
    "pretty_midi>=0.2.10",
    "pyyaml>=6.0",
    "torchfcpe>=0.0.4",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# RTX 5060 Laptop 是 sm_120（Blackwell）。cu126 及更早的 wheel 架构上限是 sm_90，
# 装上去 torch.cuda.is_available() 为 False 或报 no kernel image。只用 cu128+。
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
